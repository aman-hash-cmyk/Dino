
name: daily-video

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dino-pipeline
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voice-libritts-r-medium-v1

      - name: Download Piper voice
        run: python tools/download_voice.py

      - name: Configure and verify Piper voice
        shell: bash
        run: |
          set -euo pipefail

          VOICE_PATH="$(find "$GITHUB_WORKSPACE/voices" \
            -type f -name '*.onnx' -print -quit)"

          if [ -z "$VOICE_PATH" ]; then
            echo "::error::No Piper .onnx model found in voices/."
            exit 1
          fi

          if [ ! -f "${VOICE_PATH}.json" ]; then
            echo "::error::Missing voice configuration: ${VOICE_PATH}.json"
            exit 1
          fi

          echo "PIPER_VOICE=$VOICE_PATH" >> "$GITHUB_ENV"
          echo "Piper model configured: $VOICE_PATH"

      - name: Verify Piper environment
        shell: bash
        run: |
          set -euo pipefail
          echo "PIPER_VOICE=$PIPER_VOICE"
          test -f "$PIPER_VOICE"
          test -f "${PIPER_VOICE}.json"

      - name: Make and upload today's episode
        run: python run_daily.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'private' }}

      - name: Save episode history
        if: success()
        run: |
          git config user.name "dino-bot"
          git config user.email "dino-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Episode history"
          git pull --rebase
          git push
