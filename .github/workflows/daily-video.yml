name: daily-video

on:
  schedule:
    - cron: "30 10 * * *"      # 10:30 UTC = 4:00 PM India time. Change to suit you.
  workflow_dispatch:           # lets you press "Run workflow" manually

permissions:
  contents: write              # needed to save episode history back to the repo

concurrency:
  group: dino-pipeline
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Cache Piper voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-voice-libritts-r-medium-v1

      - run: python tools/download_voice.py

      - name: Make and upload today's episode
        run: python run_daily.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'private' }}

      - name: Save episode history
        run: |
          git config user.name "dino-bot"
          git config user.email "dino-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Episode history"
          git pull --rebase
          git push
